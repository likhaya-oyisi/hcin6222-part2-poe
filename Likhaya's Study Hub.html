<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Likhaya's Study Hub</title>
<style>
  :root{
    --primary:#15411a; --primary-dark:#0b2812; --accent:#04230f; --accent-light:#E4F1F0;
    --bg:#F6F7FB; --card:#FFFFFF; --text:#1B1E2B; --muted:#4A4F63;
    --border:#D9DCE8; --focus:#FFB020; --success:#1E7B34; --danger:#B3261E;
    --radius:10px; --shadow:0 2px 8px rgba(27,30,43,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Segoe UI',Times 'Times New Roman', Times, serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px}
  
  /* Focus visibility (WCAG 2.4.7) */
  
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
  .skip-link{position:absolute;left:-999px;top:0;background:var(--primary);color:#fff;padding:10px 16px;z-index:100;border-radius:0 0 8px 0}
  .skip-link:focus{left:0}
 
  /* Header / nav consistency */
 
  header.topbar{background:var(--primary);color:#fff}
  .topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:12px 20px}
  .brand{font-weight:700;font-size:1.15rem;letter-spacing:.3px;color:#fff;text-decoration:none;white-space:nowrap}
  nav.main-nav{display:flex;gap:6px;flex:1}
  nav.main-nav a{color:#E4E7F7;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.95rem}
  nav.main-nav a[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  nav.main-nav a:hover{background:rgba(255,255,255,.12);color:#fff}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:.9rem}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;object-fit:cover;border:2px solid rgba(255,255,255,.25)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  main{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
  footer{background:var(--primary-dark);color:#C9CEE9;padding:20px;text-align:center;font-size:.9rem}
 
  /* Typography & headings */
 
  h1{font-size:1.9rem;margin:0 0 10px} h2{font-size:1.35rem;margin:26px 0 10px} h3{font-size:1.05rem;margin:0 0 8px}
  .muted{color:var(--muted)}
  .breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:14px}
  .breadcrumb a{color:var(--primary)}
 
  /* Hero */
 
  .hero{background:#0b2812;color:#fff;border-radius:0;padding:44px 40px;margin-bottom:28px}
  .hero h1{font-size:2.2rem;margin-bottom:8px}
  .hero p{max-width:560px;color:#E4E7F7;margin:0 0 22px}
  .searchbar{display:flex;gap:10px;max-width:620px;flex-wrap:wrap}
  .searchbar input{flex:1;min-width:220px;padding:13px 16px;border-radius:10px;border:2px solid transparent;font-size:1rem}
  .searchbar input:focus-visible{border-color:var(--focus)}
 
  /* Buttons */
 
  .btn{display:inline-block;border:none;cursor:pointer;font-size:.95rem;font-weight:600;padding:12px 22px;border-radius:10px;text-decoration:none;text-align:center}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#0B6665}
  .btn-secondary{background:#fff;color:var(--primary)}
  .btn-secondary:hover{background:#EEF0FA}
  .btn-ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
  .btn-ghost:hover{background:#EEF0FA}
  .btn-small{padding:8px 16px;font-size:.88rem}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
 
  /* Cards & grids */
 
  .grid{display:grid;gap:18px}
  .grid-3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card h3 a{color:var(--primary);text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .tag{display:inline-block;background:var(--accent-light);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin-right:6px}
  .tag-blue{background:#E7EAF9;color:var(--primary)}
  .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin:8px 0 14px}
  .meta span b{color:var(--text)}
  .stars{color:#B98A00;font-size:.9rem;letter-spacing:1px}
 
  /* Steps*/
 
  .steps{display:flex;gap:0;margin:0 0 26px}
  .step{flex:1;text-align:center;font-size:.85rem;color:var(--muted);border-top:4px solid var(--border);padding-top:10px}
  .step.active{border-top-color:var(--accent);color:var(--accent);font-weight:700}
  .step.done{border-top-color:var(--success);color:var(--success)}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:.92rem}
  input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;background:#fff}
  textarea{min-height:80px;resize:vertical}
  .hint{font-size:.82rem;color:var(--muted);margin-top:4px}
  .field-error{display:none;color:var(--danger);font-size:.85rem;font-weight:600;margin-top:4px}
  input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--danger)}
 
  /* Calendar */
 
  .session{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .session .when{font-weight:700}
  .session .status{font-size:.85rem;font-weight:700}
  .status.confirmed{color:var(--success)}
  .status.pending{color:#8A5A00}
  .session-actions{display:flex;gap:8px;flex-wrap:wrap}
 
  /* feedback */
 
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:13px 22px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50}
 
  /* Messaging */
 
  .thread{border:1.5px solid var(--border);border-radius:10px;padding:16px;background:#fff;margin-bottom:12px;max-height:260px;overflow:auto}
  .msg{margin-bottom:14px;display:flex;gap:10px}
  .msg .bubble{background:var(--bg);border-radius:12px;padding:10px 14px;max-width:75%}
  .msg.mine{flex-direction:row-reverse}
  .msg.mine .bubble{background:var(--accent-light)}
  .msg .who{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:3px}
  .msg time{font-size:.72rem;color:var(--muted);margin-left:8px}
 
  /* Celebration banner*/
 
  .celebrate{background:#E9F7EC;border:1.5px solid #9AD3A6;color:#175C29;border-radius:12px;padding:18px 22px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
  .celebrate .big{font-size:1.25rem;font-weight:800}
 
  /* Empty state */
 
  .empty{text-align:center;padding:56px 20px;background:#fff;border:1.5px dashed var(--border);border-radius:14px}
  .empty .emoji{font-size:2.6rem}
 
  /* Members / social */
 
  .member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .member:last-child{border-bottom:none}
  .member .avatar{width:30px;height:30px;font-size:.8rem}
  .conduct{font-size:.83rem;color:var(--muted);background:#FBF6E9;border:1px solid #EAD9A0;border-radius:8px;padding:10px 14px;margin-top:18px}
  .success-text{color:var(--success);font-weight:700}
  .danger-text{color:var(--danger)}
  @media (max-width:640px){ .hero{padding:30px 22px} .hero h1{font-size:1.6rem} nav.main-nav a{padding:8px 9px;font-size:.85rem} }
</style>
<base target="_blank">
</head>

    <div class="emoji" aria-hidden="true">&#128161;</div>
    <h3>No groups for PHY1503 yet</h3>
    <p class="muted">You could be the one to start something great. It only takes about two minutes.</p>
    <p style="margin-top:18px"><a class="btn btn-primary" href="#/create">Be the first to create a group</a></p>
  </div>
`;

function go(h){ location.hash = h; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function render(){
  let h = location.hash.replace('#/','') || 'home';
  if(!screens[h]) h='home';
  document.getElementById('main-content').innerHTML = screens[h];
  document.querySelectorAll('[data-nav]').forEach(a=>{
    if(a.dataset.nav===h) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
